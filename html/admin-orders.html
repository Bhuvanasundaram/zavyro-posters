<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Orders — Zavyro Admin</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 10% 5%,
                    rgba(124,58,237,.13),
                    transparent 30%
                ),
                #080808;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .orders-page {
            width: min(1250px, 94%);
            margin: auto;
            padding: 60px 0;
        }

        .orders-container {
            width: 100%;
        }

        .back-btn {
            display: inline-block;
            color: #b8a5ff;
            text-decoration: none;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .back-btn:hover {
            color: #fff;
        }

        .orders-header {
            margin-bottom: 30px;
        }

        .eyebrow {
            color: #8b5cf6;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        .orders-header h1 {
            margin: 0;
            font-size: clamp(35px, 5vw, 56px);
        }

        .orders-header p {
            color: #888;
            margin-top: 10px;
        }

        .order-stats {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 18px;
        }

        .stat-card {
            padding: 20px;
            border: 1px solid #292929;
            border-radius: 14px;
            background: #101010;
        }

        .stat-card span {
            display: block;
            color: #777;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .stat-card strong {
            font-size: 25px;
        }

        .orders-tools {
            display: grid;
            grid-template-columns: 1fr 220px;
            gap: 12px;
            padding: 15px;
            margin-bottom: 18px;
            background: #101010;
            border: 1px solid #292929;
            border-radius: 14px;
        }

        .orders-tools input,
        .orders-tools select {
            width: 100%;
            min-height: 45px;
            padding: 12px;
            border: 1px solid #303030;
            border-radius: 9px;
            background: #080808;
            color: #fff;
            outline: none;
        }

        .orders-tools input:focus,
        .orders-tools select:focus {
            border-color: #7c3aed;
        }

        .orders-list {
            display: grid;
            gap: 18px;
        }

        .loading,
        .empty-orders {
            text-align: center;
            padding: 70px 20px;
            color: #777;
            border: 1px solid #292929;
            border-radius: 16px;
            background: #101010;
        }

        .order-card {
            overflow: hidden;
            border: 1px solid #292929;
            border-radius: 16px;
            background: #101010;
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 18px;
            border-bottom: 1px solid #252525;
        }

        .order-id {
            font-size: 17px;
            font-weight: 800;
        }

        .order-date {
            margin-top: 5px;
            color: #777;
            font-size: 12px;
        }

        .payment-status {
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .payment-paid {
            color: #4ade80;
            background: rgba(34,197,94,.12);
            border: 1px solid rgba(34,197,94,.25);
        }

        .payment-pending {
            color: #facc15;
            background: rgba(250,204,21,.10);
            border: 1px solid rgba(250,204,21,.25);
        }

        .payment-failed {
            color: #f87171;
            background: rgba(239,68,68,.10);
            border: 1px solid rgba(239,68,68,.25);
        }

        .order-body {
            padding: 18px;
        }

        .customer-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .customer-box {
            padding: 15px;
            border: 1px solid #252525;
            border-radius: 12px;
            background: #0c0c0c;
        }

        .customer-box h3 {
            margin: 0 0 12px;
            font-size: 14px;
        }

        .customer-info {
            display: grid;
            gap: 7px;
            color: #999;
            font-size: 13px;
            line-height: 1.5;
        }

        .customer-info strong {
            color: #ddd;
        }

        .items-title {
            margin-bottom: 10px;
            font-weight: 800;
        }

        .order-items-list {
            display: grid;
            gap: 8px;
        }

        .order-item {
            display: grid;
            grid-template-columns: 65px minmax(0,1fr) auto;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border: 1px solid #242424;
            border-radius: 10px;
            background: #0c0c0c;
        }

        .order-item > img {
            width: 65px;
            height: 65px;
            border-radius: 7px;
            object-fit: contain;
            background: #050505;
        }

        .item-info {
            min-width: 0;
            display: grid;
            gap: 5px;
        }

        .item-info strong {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .item-info span {
            color: #777;
            font-size: 12px;
        }

        .item-price {
            color: #c4b5fd;
            font-weight: 800;
        }

        .custom-label {
            color: #c4b5fd !important;
        }

        .download-btn {
            margin-top: 5px;
            padding: 7px 9px;
            border: 1px solid #7c3aed;
            border-radius: 7px;
            background: #111;
            color: #c4b5fd;
            cursor: pointer;
            font-size: 9px;
            font-weight: 800;
        }

        .order-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid #252525;
        }

        .order-total-label {
            color: #777;
            font-size: 12px;
        }

        .order-total {
            margin-top: 4px;
            font-size: 24px;
            font-weight: 900;
        }

        .status-control {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .status-control label {
            color: #888;
            font-size: 12px;
        }

        .order-status-select {
            min-width: 180px;
            padding: 10px;
            border: 1px solid #303030;
            border-radius: 8px;
            background: #080808;
            color: #fff;
            outline: none;
        }

        .order-status-select:focus {
            border-color: #7c3aed;
        }

        .status-message {
            display: none;
            margin-top: 7px;
            color: #86efac;
            font-size: 11px;
            text-align: right;
        }

        .error-orders {
            padding: 40px;
            border: 1px solid #642525;
            border-radius: 15px;
            color: #f87171;
            background: #140909;
        }

        @media (max-width: 850px) {

            .order-stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .orders-tools {
                grid-template-columns: 1fr;
            }

            .customer-section {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 600px) {

            .order-stats {
                grid-template-columns: 1fr;
            }

            .order-top {
                align-items: flex-start;
                flex-direction: column;
            }

            .order-bottom {
                align-items: stretch;
                flex-direction: column;
            }

            .status-control {
                align-items: stretch;
                flex-direction: column;
            }

            .order-status-select {
                width: 100%;
            }

            .order-item {
                grid-template-columns: 55px minmax(0,1fr);
            }

            .order-item > img {
                width: 55px;
                height: 55px;
            }

            .item-price {
                grid-column: 2;
            }
        }

    </style>

</head>

<body>

<main class="orders-page">

    <div class="orders-container">

        <a
            href="admin.html"
            class="back-btn"
        >
            ← Back to Admin
        </a>


        <header class="orders-header">

            <div class="eyebrow">
                ADMIN MANAGEMENT
            </div>

            <h1>
                Orders
            </h1>

            <p>
                View customers, orders, payments,
                delivery status and custom poster files.
            </p>

        </header>


        <!-- STATS -->

        <section class="order-stats">

            <div class="stat-card">

                <span>
                    Total Orders
                </span>

                <strong id="totalOrders">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Paid Orders
                </span>

                <strong id="paidOrders">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Pending Orders
                </span>

                <strong id="pendingOrders">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Total Revenue
                </span>

                <strong id="totalRevenue">
                    ₹0
                </strong>

            </div>

        </section>


        <!-- SEARCH -->

        <section class="orders-tools">

            <input
                type="search"
                id="orderSearch"
                placeholder="Search customer, email, phone or order ID..."
            >


            <select id="statusFilter">

                <option value="all">
                    All Orders
                </option>

                <option value="pending">
                    Pending
                </option>

                <option value="confirmed">
                    Confirmed
                </option>

                <option value="processing">
                    Processing
                </option>

                <option value="shipped">
                    Shipped
                </option>

                <option value="out_for_delivery">
                    Out for Delivery
                </option>

                <option value="delivered">
                    Delivered
                </option>

            </select>

        </section>


        <!-- ORDERS -->

        <section
            id="ordersList"
            class="orders-list"
        >

            <div class="loading">
                Loading orders...
            </div>

        </section>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/admin-orders.js"></script>

</body>
</html>
