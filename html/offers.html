
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Offers & Combos — Zavyro Posters</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <style>
        .offers-page {
            min-height: 100vh;
            padding: 140px 6% 80px;
            background:
                radial-gradient(circle at 10% 20%, rgba(124, 58, 237, 0.12), transparent 28%),
                radial-gradient(circle at 90% 30%, rgba(139, 92, 246, 0.10), transparent 25%),
                #080808;
        }

        .offers-header {
            text-align: center;
            max-width: 750px;
            margin: 0 auto 50px;
        }

        .offers-header .eyebrow {
            color: #8b5cf6;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .offers-header h1 {
            margin: 0;
            font-size: clamp(38px, 5vw, 64px);
            line-height: 1;
        }

        .offers-header h1 span {
            color: #8b5cf6;
        }

        .offers-header p {
            margin-top: 18px;
            color: #aaa;
            font-size: 16px;
            line-height: 1.7;
        }

        .offer-filters {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 40px;
        }

        .offer-filter {
            border: 1px solid #292929;
            background: #111;
            color: #aaa;
            padding: 11px 18px;
            border-radius: 999px;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .offer-filter:hover,
        .offer-filter.active {
            color: #fff;
            border-color: #7c3aed;
            background: rgba(124, 58, 237, 0.15);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.15);
        }

        .offers-grid {
            max-width: 1250px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .offer-card {
            position: relative;
            overflow: hidden;
            border: 1px solid #2b164c;
            border-radius: 18px;
            background: linear-gradient(
                145deg,
                #111,
                #0c0c0c
            );
            box-shadow:
                0 0 0 1px rgba(124, 58, 237, 0.05),
                0 15px 50px rgba(0,0,0,0.35);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .offer-card:hover {
            transform: translateY(-6px);
            border-color: #7c3aed;
            box-shadow:
                0 18px 60px rgba(0,0,0,0.45),
                0 0 35px rgba(124, 58, 237, 0.15);
        }

        .offer-image {
            width: 100%;
            height: 280px;
            background: #0b0b0b;
            overflow: hidden;
        }

        .offer-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .offer-image.no-image {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6e6e6e;
            font-size: 50px;
            background:
                radial-gradient(
                    circle,
                    rgba(124, 58, 237, 0.18),
                    transparent 55%
                ),
                #0b0b0b;
        }

        .offer-body {
            padding: 22px;
        }

        .offer-badge {
            display: inline-flex;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(124, 58, 237, 0.14);
            color: #b794ff;
            border: 1px solid rgba(124, 58, 237, 0.35);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            margin-bottom: 12px;
        }

        .offer-body h2 {
            margin: 0;
            font-size: 23px;
            color: #fff;
        }

        .offer-body p {
            color: #999;
            line-height: 1.6;
            margin: 10px 0 18px;
            min-height: 48px;
        }

        .offer-details {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }

        .offer-detail {
            font-size: 12px;
            color: #bbb;
            padding: 7px 10px;
            background: #171717;
            border: 1px solid #252525;
            border-radius: 8px;
        }

        .offer-price {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .offer-price strong {
            color: #ffd84d;
            font-size: 23px;
        }

        .offer-price span {
            color: #777;
            font-size: 12px;
        }

        .offer-button {
            display: block;
            width: 100%;
            margin-top: 18px;
            border: 0;
            border-radius: 10px;
            padding: 13px 16px;
            background: linear-gradient(135deg, #7c3aed, #8b5cf6);
            color: #fff;
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .offer-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(124, 58, 237, 0.3);
        }

        .offers-loading,
        .offers-empty,
        .offers-error {
            max-width: 700px;
            margin: 50px auto;
            text-align: center;
            color: #999;
        }

        .offers-error {
            color: #ff8585;
        }

        @media (max-width: 1000px) {
            .offers-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 650px) {
            .offers-page {
                padding: 120px 18px 50px;
            }

            .offers-grid {
                grid-template-columns: 1fr;
            }

            .offer-image {
                height: 250px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <a href="index.html" class="brand">

            <span class="brand-mark">
                Z
            </span>

            <span class="brand-name">
                ZAVYRO
                <small>POSTERS</small>
            </span>

        </a>


        <nav class="nav-links" id="navLinks">

            <a href="index.html">
                Home
            </a>

            <a href="shop.html">
                Shop
            </a>

            <a href="shop.html#categories">
                Categories
            </a>

            <a
                href="offers.html"
                class="offers-nav-link active"
            >
                🔥 Offers
            </a>

            <a href="customize.html">

            </a>

            <a
                href="random.html"

                <span id="surpriseCountBadge">0</span>

        <a

            <span>Cart</span>

                0
            </b>

        </a>


        <button
            id="menuToggle"
            class="menu-toggle"
            type="button"
            aria-label="Open menu"
        >

            <span></span>
            <span></span>
            <span></span>

        </button>

    </header>


    <!-- OFFERS -->
    <main class="offers-page">

        <header class="offers-header">
            <div class="eyebrow">Zavyro Exclusive</div>

            <h1>
                Offers <span>&</span> Combos
            </h1>

            <p>
                Get more posters for less. Explore our special deals,
                curated combos and limited-time offers.
            </p>
        </header>


        <div class="offer-filters">
            <button class="offer-filter active" data-filter="all">
                All
            </button>

            <button class="offer-filter" data-filter="buy_get">
                Buy & Get
            </button>

            <button class="offer-filter" data-filter="combo">
                Combos
            </button>

            <button class="offer-filter" data-filter="discount">
                Discounts
            </button>
        </div>


        <div id="offersLoading" class="offers-loading">
            Loading offers...
        </div>

        <div id="offersError" class="offers-error" hidden></div>

        <div id="offersEmpty" class="offers-empty" hidden>
            No active offers available right now.
        </div>

        <section id="offersGrid" class="offers-grid"></section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/offers.js"></script>

</html>
