<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Offers & Combos — Zavyro Admin</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(124,58,237,.12),
                    transparent 30%
                ),
                #080808;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .admin-offers-page {
            width: min(1200px, 94%);
            margin: auto;
            padding: 70px 0;
        }

        .back-link {
            display: inline-block;
            color: #b8a5ff;
            text-decoration: none;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .back-link:hover {
            color: #fff;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .eyebrow {
            color: #8b5cf6;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        .page-header h1 {
            margin: 0;
            font-size: clamp(32px, 5vw, 52px);
        }

        .page-header p {
            color: #888;
            margin: 10px 0 0;
        }

        .btn {
            border: 1px solid #303030;
            border-radius: 10px;
            padding: 11px 17px;
            color: #fff;
            background: #151515;
            cursor: pointer;
            font-weight: 700;
            transition: .2s;
        }

        .btn:hover {
            border-color: #7c3aed;
            transform: translateY(-1px);
        }

        .btn-primary {
            background: #7c3aed;
            border-color: #7c3aed;
        }

        .btn-primary:hover {
            background: #8b5cf6;
        }

        .btn-danger {
            border-color: #6b2020;
            color: #fca5a5;
        }

        .offers-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(290px, 1fr));
            gap: 18px;
        }

        .offer-card {
            overflow: hidden;
            background: #101010;
            border: 1px solid #292929;
            border-radius: 16px;
            transition: .25s;
        }

        .offer-card:hover {
            border-color: #5b2ca5;
            transform: translateY(-3px);
        }

        .offer-image {
            width: 100%;
            height: 210px;
            background: #050505;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .offer-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .no-image {
            color: #555;
            font-size: 13px;
        }

        .offer-content {
            padding: 18px;
        }

        .offer-badge {
            display: inline-block;
            padding: 5px 9px;
            margin-bottom: 10px;
            border-radius: 999px;
            background: rgba(124,58,237,.14);
            border: 1px solid rgba(124,58,237,.35);
            color: #c4b5fd;
            font-size: 11px;
            font-weight: 800;
        }

        .offer-content h3 {
            margin: 0 0 9px;
            font-size: 20px;
        }

        .offer-content p {
            margin: 7px 0;
            color: #999;
            line-height: 1.5;
        }

        .offer-type {
            color: #fff !important;
            font-weight: 700;
        }

        .status {
            display: inline-block;
            margin-top: 9px;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 800;
        }

        .status.active {
            color: #4ade80;
            background: rgba(34,197,94,.12);
            border: 1px solid rgba(34,197,94,.25);
        }

        .status.inactive {
            color: #f87171;
            background: rgba(239,68,68,.12);
            border: 1px solid rgba(239,68,68,.25);
        }

        .featured {
            display: inline-block;
            margin-left: 6px;
            color: #c4b5fd;
            background: rgba(124,58,237,.12);
            border: 1px solid rgba(124,58,237,.25);
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 800;
        }

        .offer-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 7px;
            margin-top: 16px;
        }

        .offer-actions .btn {
            padding: 9px 5px;
            font-size: 11px;
        }

        .loading,
        .empty-state,
        .error-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 70px 20px;
            color: #777;
            background: #101010;
            border: 1px solid #292929;
            border-radius: 16px;
        }

        .error-state {
            color: #f87171;
        }

        /* MODAL */

        .modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0,0,0,.82);
            backdrop-filter: blur(8px);
        }

        .modal.active {
            display: flex;
        }

        .modal-box {
            width: min(620px, 100%);
            max-height: 92vh;
            overflow-y: auto;
            background: #111;
            border: 1px solid #5b2ca5;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 25px 80px rgba(0,0,0,.6);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close-modal {
            width: 36px;
            height: 36px;
            border: 1px solid #303030;
            border-radius: 9px;
            background: #151515;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #ccc;
            font-size: 13px;
            font-weight: 700;
        }

        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group input[type="file"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #303030;
            border-radius: 9px;
            background: #080808;
            color: #fff;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #7c3aed;
        }

        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .type-fields {
            display: none;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid #292929;
            border-radius: 12px;
            background: #0c0c0c;
        }

        .type-fields.active {
            display: block;
        }

        .image-preview {
            display: none;
            width: 100%;
            height: 170px;
            margin-top: 10px;
            border-radius: 10px;
            overflow: hidden;
            background: #050505;
            border: 1px solid #292929;
            align-items: center;
            justify-content: center;
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .check-row {
            display: flex !important;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .check-row input {
            width: auto;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 24px;
        }

        @media (max-width: 650px) {
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .offer-actions {
                grid-template-columns: 1fr;
            }

            .admin-offers-page {
                padding-top: 40px;
            }
        }
    </style>
</head>

<body>

<main class="admin-offers-page">

    <a href="admin.html" class="back-link">
        ← Back to Admin
    </a>

    <header class="page-header">

        <div>
            <div class="eyebrow">ADMIN MANAGEMENT</div>

            <h1>Offers & Combos</h1>

            <p>
                Create and manage promotional offers for customers.
            </p>
        </div>

        <button
            type="button"
            class="btn btn-primary"
            id="addOfferBtn"
        >
            + Create Offer
        </button>

    </header>

    <section
        id="offersContainer"
        class="offers-grid"
    >
        <div class="loading">
            Loading offers...
        </div>
    </section>

</main>


<!-- OFFER MODAL -->

<div
    class="modal"
    id="offerModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="modalTitle">
                Create Offer
            </h2>

            <button
                type="button"
                class="close-modal"
                id="closeModal"
            >
                ×
            </button>

        </div>


        <form id="offerForm">

            <input
                type="hidden"
                id="offerId"
            >


            <div class="form-group">

                <label for="offerTitle">
                    Offer Title
                </label>

                <input
                    type="text"
                    id="offerTitle"
                    placeholder="Example: Buy 2 Get 1 Free"
                    required
                >

            </div>


            <div class="form-group">

                <label for="offerDescription">
                    Description
                </label>

                <textarea
                    id="offerDescription"
                    placeholder="Describe the offer..."
                ></textarea>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="offerType">
                        Offer Type
                    </label>

                    <select id="offerType">

                        <option value="buy_get">
                            Buy X Get Y
                        </option>

                        <option value="combo">
                            Combo
                        </option>

                        <option value="discount">
                            Percentage Discount
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="offerBadge">
                        Badge
                    </label>

                    <input
                        type="text"
                        id="offerBadge"
                        placeholder="HOT DEAL"
                    >

                </div>

            </div>


            <!-- BUY GET -->

            <div
                id="buyGetFields"
                class="type-fields active"
            >

                <div class="form-row">

                    <div class="form-group">

                        <label for="buyQty">
                            Buy Quantity
                        </label>

                        <input
                            type="number"
                            id="buyQty"
                            min="1"
                            value="2"
                        >

                    </div>

                    <div class="form-group">

                        <label for="getQty">
                            Get Quantity
                        </label>

                        <input
                            type="number"
                            id="getQty"
                            min="1"
                            value="1"
                        >

                    </div>

                </div>

            </div>


            <!-- COMBO -->

            <div
                id="comboFields"
                class="type-fields"
            >

                <div class="form-row">

                    <div class="form-group">

                        <label for="comboQty">
                            Combo Quantity
                        </label>

                        <input
                            type="number"
                            id="comboQty"
                            min="1"
                            value="2"
                        >

                    </div>

                    <div class="form-group">

                        <label for="comboPrice">
                            Combo Price
                        </label>

                        <input
                            type="number"
                            id="comboPrice"
                            min="0"
                            step="0.01"
                            placeholder="499"
                        >

                    </div>

                </div>

            </div>


            <!-- DISCOUNT -->

            <div
                id="discountFields"
                class="type-fields"
            >

                <div class="form-group">

                    <label for="discountPercent">
                        Discount Percentage
                    </label>

                    <input
                        type="number"
                        id="discountPercent"
                        min="1"
                        max="100"
                        placeholder="20"
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="offerImage">
                    Offer Image
                </label>

                <input
                    type="file"
                    id="offerImage"
                    accept="image/*"
                >

                <div
                    class="image-preview"
                    id="imagePreview"
                >
                    <img
                        id="previewImg"
                        alt="Offer Preview"
                    >
                </div>

            </div>


            <div class="form-group">

                <label class="check-row">

                    <input
                        type="checkbox"
                        id="offerActive"
                        checked
                    >

                    Active Offer

                </label>

            </div>


            <div class="form-group">

                <label class="check-row">

                    <input
                        type="checkbox"
                        id="offerFeatured"
                    >

                    Featured Offer

                </label>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="btn"
                    id="cancelOffer"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="btn btn-primary"
                    id="saveOfferBtn"
                >
                    Save Offer
                </button>

            </div>

        </form>

    </div>

</div>


<!-- IMPORTANT: Supabase library must load BEFORE supabase.js -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/admin-offers.js"></script>

</body>
</html>
