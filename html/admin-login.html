<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zavyro Posters — Admin Login</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        body {
            background: #080808;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: min(430px, 100%);
            padding: 35px;
            background: #111;
            border: 1px solid #292929;
            border-radius: 20px;
            box-shadow: 0 0 60px rgba(124, 58, 237, 0.12);
        }

        .logo {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;

            border-radius: 50%;
            background: #7c3aed;
            color: white;
            font-size: 30px;
            font-weight: 900;

            box-shadow: 0 0 35px rgba(124, 58, 237, 0.4);
        }

        .login-card h1 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 30px;
        }

        .login-subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #090909;
            color: white;
            outline: none;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: #7c3aed;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #7c3aed;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #8b5cf6;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
        }

        .message.error {
            display: block;
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #888;
            text-decoration: none;
        }

        .back-link:hover {
            color: white;
        }
    </style>
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="logo">Z</div>

        <h1>Admin Login</h1>

        <p class="login-subtitle">
            Zavyro Posters Management
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Admin email"
                    required
                >
            </div>


            <div class="form-group">
                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Admin password"
                    required
                >
            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                Login
            </button>

            <div
                id="message"
                class="message"
            ></div>

        </form>


        <a
            href="index.html"
            class="back-link"
        >
            ← Back to Zavyro Posters
        </a>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>

<script src="../js/admin-login.js"></script>

</body>
</html>
